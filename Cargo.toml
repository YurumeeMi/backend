[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = "0.8.9"
dotenvy = "0.15.7"
lettre = { version = "0.11.23", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
rand = "0.10.3"
rand_core = { version = "0.9.5", features = ["os_rng"] }
serde = "1.0.229"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tower_governor = "0.8.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
