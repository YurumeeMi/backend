[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = "0.8.9"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
